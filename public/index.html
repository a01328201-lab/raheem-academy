<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>رحيم — مساعدك الذكي</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; overflow: hidden; position: fixed; width: 100%; }
body {
  font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #0a0a1e 0%, #1a1a3e 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  overscroll-behavior: none;
  inset: 0;
}
.header {
  background: rgba(10,10,30,0.9);
  backdrop-filter: blur(20px);
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  flex-shrink: 0;
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo span:first-child { font-size: 28px; }
.header-title { font-size: 18px; font-weight: bold; color: #a0a0ff; }
.header-status { font-size: 11px; color: #4ade80; display: flex; align-items: center; gap: 4px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.menu-btn { background: none; border: none; color: #a0a0ff; font-size: 24px; cursor: pointer; padding: 8px; }
.menu-btn:active { transform: scale(0.9); }

.chat-container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.chat-container::-webkit-scrollbar { width: 4px; }
.chat-container::-webkit-scrollbar-thumb { background: #667eea; border-radius: 2px; }

.message {
  display: flex;
  margin-bottom: 12px;
  animation: fadeIn 0.3s;
  max-width: 90%;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { margin-left: auto; flex-direction: row-reverse; }
.message.ai { margin-right: auto; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  margin: 0 6px;
}
.message.user .avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
.message.ai .avatar { background: rgba(102,126,234,0.2); }

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.7;
  word-wrap: break-word;
  white-space: pre-wrap;
  max-width: 100%;
}
.message.user .bubble { background: linear-gradient(135deg, #667eea, #764ba2); border-bottom-right-radius: 4px; }
.message.ai .bubble { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }
.bubble b, .bubble strong { color: #c9b3ff; }
.bubble code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; color: #a0d8ff; direction: ltr; display: inline-block; }
.bubble pre { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; direction: ltr; text-align: left; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.5; }
.bubble pre code { background: none; padding: 0; font-size: 12px; }
.bubble a { color: #7dd3fc; }

.typing { display: flex; align-items: center; gap: 4px; padding: 8px 12px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: #667eea; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }

.welcome {
  text-align: center;
  padding: 20px 10px;
  color: #808090;
  font-size: 13px;
}
.welcome-logo { font-size: 60px; margin-bottom: 10px; animation: float 3s infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.welcome h2 { color: #a0a0ff; font-size: 22px; margin-bottom: 8px; }
.welcome p { margin-bottom: 16px; }

.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}
.quick-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 12px 8px;
  border-radius: 14px;
  color: #fff;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.quick-btn:active { background: rgba(102,126,234,0.3); transform: scale(0.97); }

.input-area {
  padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(10,10,30,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
  z-index: 50;
}
.input-wrapper { flex: 1; }
.input-area textarea {
  width: 100%;
  padding: 12px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.4;
}
.input-area textarea::placeholder { color: #606080; }
.input-area textarea:focus { border-color: #667eea; }
.send-btn {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { opacity: 0.5; }

.scroll-btn {
  position: fixed;
  bottom: 90px;
  left: 16px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(102,126,234,0.5);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
  pointer-events: none;
  z-index: 60;
}
.scroll-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.scroll-btn:active { transform: scale(0.9); }

.drawer {
  position: fixed;
  top: 0;
  right: -100%;
  width: 80%;
  max-width: 320px;
  height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  background: #12122a;
  z-index: 200;
  transition: right 0.3s;
  padding: 60px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  border-left: 1px solid rgba(255,255,255,0.1);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
}
.drawer.open { right: 0; }
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
}
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer-title { color: #a0a0ff; font-size: 16px; margin-bottom: 16px; font-weight: bold; }
.drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s;
  color: #fff;
  font-family: inherit;
  width: 100%;
  text-align: right;
  font-size: 14px;
}
.drawer-item:active { background: rgba(102,126,234,0.2); border-color: #667eea; }
.drawer-icon { font-size: 20px; }

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* JavaScript Mode Badge */
.js-badge {
  position: absolute;
  top: 50%;
  right: 60px;
  transform: translateY(-50%);
  background: linear-gradient(135deg, #f7df1e, #f0db4f);
  color: #000;
  font-size: 11px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 10px;
  display: none;
  align-items: center;
  gap: 4px;
}
.js-badge.active { display: flex; }
.js-badge button {
  background: rgba(0,0,0,0.2);
  border: none;
  color: #000;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: bold;
  cursor: pointer;
  font-size: 11px;
}

/* RAHEEM_LANDSCAPE_DESKTOP_LAYOUT */
@media (orientation: landscape) and (max-height: 600px) and (min-width: 560px) {
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    display: grid;
    position: fixed;
    inset: 0;
    grid-template-columns: minmax(0, 1fr) 230px;
    grid-template-rows: 52px minmax(0, 1fr) auto;
    grid-template-areas:
      "header sidebar"
      "chat sidebar"
      "composer sidebar";
    gap: 0;
  }

  .header {
    grid-area: header;
    padding: 6px 14px;
    min-width: 0;
  }

  .chat-container {
    grid-area: chat;
    min-width: 0;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    padding: 12px 18px;
  }

  .message { max-width: 90%; margin-bottom: 9px; }
  .bubble { font-size: 13px; }
  .welcome { padding: 10px; }
  .welcome-logo { font-size: 42px; margin-bottom: 4px; }
  .welcome h2 { font-size: 20px; margin-bottom: 5px; }
  .quick-actions { gap: 6px; margin-top: 8px; }
  .quick-btn { padding: 9px 5px; font-size: 11px; }

  .input-area {
    grid-area: composer;
    min-width: 0;
    padding: 7px 12px;
    gap: 8px;
  }

  .input-area textarea {
    min-height: 40px;
    max-height: 78px;
    padding: 9px 12px;
    font-size: 14px;
  }

  .send-btn { width: 40px; height: 40px; }

  .drawer, .drawer.open {
    grid-area: sidebar;
    position: relative;
    inset: auto;
    right: auto;
    width: 230px;
    min-width: 0;
    max-width: none;
    height: 100%;
    max-height: 100%;
    padding: 14px 10px;
    overflow-y: auto;
    overflow-x: hidden;
    visibility: visible;
    transform: none;
    transition: none;
    background: #101126;
    border-left: 1px solid rgba(255,255,255,.12);
    z-index: 110;
  }

  .drawer-overlay, .drawer-overlay.open {
    display: none !important;
  }

  .drawer-title { font-size: 15px; margin-bottom: 10px; }
  .drawer-item { padding: 10px; gap: 8px; }
  .scroll-btn { bottom: 65px; }
}

</style>

<script>
// ═══════════════════════════════════════
// Telegram WebApp
// ═══════════════════════════════════════
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0a0a1e'); } catch(e) {}
  try { tg.setBackgroundColor('#0a0a1e'); } catch(e) {}
}

const user = tg?.initDataUnsafe?.user;
const initData = tg?.initData || '';
const chatContainer = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const scrollBtn = document.getElementById('scrollBtn');
let sessionId = localStorage.getItem('raheem_session') || 'web_' + Math.random().toString(36).slice(2, 11);
localStorage.setItem('raheem_session', sessionId);

let isSending = false;
let autoScrollEnabled = true;

// متابعة آخر المحادثة تلقائياً بدون تعطيل بسبب لمس الشاشة
function scrollToBottom(force = false) {
  if (force) autoScrollEnabled = true;
  if (!autoScrollEnabled) return;

  requestAnimationFrame(() => {
    if (!autoScrollEnabled || !chatContainer.isConnected) return;
    chatContainer.scrollTop = chatContainer.scrollHeight;
    requestAnimationFrame(() => {
      if (autoScrollEnabled) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  });
}

chatContainer.addEventListener('scroll', () => {
  const gap = chatContainer.scrollHeight -
    chatContainer.scrollTop - chatContainer.clientHeight;
  const atBottom = gap < 100;

  autoScrollEnabled = atBottom;
  scrollBtn.classList.toggle('show', !atBottom);
}, { passive: true });

function smartScroll() {
  scrollToBottom(false);
}

// مراقبة تغيّر ارتفاع الرسائل والردود الطويلة
if (typeof ResizeObserver !== 'undefined' &&
    !window.raheemMessageResizeObserver) {
  window.raheemMessageResizeObserver = new ResizeObserver(() => {
    smartScroll();
  });

  window.raheemMessageResizeObserver.observe(chatContainer);
  if (chatContainer.firstElementChild) {
    window.raheemMessageResizeObserver.observe(
      chatContainer.firstElementChild
    );
  }
}

// عند فتح أو إغلاق لوحة المفاتيح على الموبايل
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    smartScroll();
  });
}

window.addEventListener('resize', () => smartScroll());

// ═══════════════════════════════════════
// Utils
// ═══════════════════════════════════════
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatMessage(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => '<pre><code>' + code.trim() + '</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  html = html.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  return html;
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const avatar = role === 'user' ? '👤' : '🤖';
  div.innerHTML = '<div class="avatar">' + avatar + '</div>' +
    '<div class="bubble">' + formatMessage(text) + '</div>';
  chatContainer.appendChild(div);
  if (window.raheemMessageResizeObserver) {
    window.raheemMessageResizeObserver.observe(div);
  }
  smartScroll();
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-msg';
  div.innerHTML = '<div class="avatar">🤖</div>' +
    '<div class="bubble typing"><span></span><span></span><span></span></div>';
  chatContainer.appendChild(div);
  if (window.raheemMessageResizeObserver) {
    window.raheemMessageResizeObserver.observe(div);
  }
  smartScroll();
}

function removeTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

// ═══════════════════════════════════════
// Send Message
// ═══════════════════════════════════════
let activeSection = 'general';
async function sendMessage(textOverride, sectionOverride) {
  if (isSending) return;
  const text = (textOverride || inputEl.value).trim();
  if (!text) return;

  if (!textOverride) {
    inputEl.value = '';
    autoResize(inputEl);
  }
  isSending = true;
  sendBtn.disabled = true;
  window.raheemHideComposer();

  addMessage(text, 'user');
  scrollToBottom(true);
  addTyping();
  scrollToBottom(true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId, initData, section: sectionOverride || activeSection }),
    });

    const data = await res.json();
    removeTyping();

    if (data.ok && data.text) {
      addMessage(data.text, 'ai');
      scrollToBottom(true);
    } else {
      addMessage('❌ ' + (data.error || 'حصل خطأ'), 'ai');
      scrollToBottom(true);
    }
  } catch (e) {
    removeTyping();
    addMessage('❌ خطأ في الاتصال', 'ai');
    scrollToBottom(true);
  }

  isSending = false;
  sendBtn.disabled = false;
  window.raheemHideComposer();
}

function quickSend(text, section = 'general') {
  toggleDrawer();
  activeSection = section;
  sendMessage(text, section);
}

/* RAHEEM_WEB_MEMORY_CLEAR_V1 */
async function clearChat() {
  toggleDrawer();
  try {
    const r = await fetch('/api/chat/history?section=' + encodeURIComponent(activeSection), {
      method: 'DELETE',
      credentials: 'same-origin'
    });
    if (!r.ok) throw new Error('delete_failed');
  } catch (e) {
    showToast('تعذر حذف المحادثة المحفوظة');
    return;
  }
  chatContainer.innerHTML = '';
  sessionId = 'web_' + Math.random().toString(36).slice(2, 11);
  localStorage.setItem('raheem_session', sessionId);
  showToast('تم مسح المحادثة المحفوظة');
}

async function logoutAccount() {
  if (!confirm('هل تريد تسجيل الخروج؟ يمكنك الدخول مرة أخرى بأي حساب.')) return;
  const btn = document.getElementById('logoutAccountBtn');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/auth/logout', {
      method: 'POST',
      credentials: 'same-origin'
    });
    if (!r.ok) throw new Error('logout_failed');
    window.location.replace('/login');
  } catch (e) {
    if (btn) btn.disabled = false;
    alert('تعذر تسجيل الخروج. حاول مرة أخرى.');
  }
}

</script>

<script id="raheem-composer-script">
(function () {
  const area = document.querySelector('.input-area');
  const field = document.getElementById('input');
  const toggle = document.getElementById('raheemComposerToggle');
  if (!area || !field || !toggle) return;

  window.raheemHideComposer = function () {
    area.classList.add('raheem-composer-hidden');
    toggle.style.display = 'flex';
    toggle.setAttribute('aria-label', 'فتح خانة الكتابة');
    toggle.textContent = '✎';
    if (document.activeElement === field) field.blur();
  };

  window.raheemToggleComposer = function () {
    const hidden = area.classList.contains('raheem-composer-hidden');
    if (hidden) {
      area.classList.remove('raheem-composer-hidden');
      toggle.style.display = 'none';
      field.focus();
    } else {
      window.raheemHideComposer();
    }
  };

  window.raheemHideComposer();
})();
</script>


<div id="raheemToolsOverlay" aria-hidden="true">
  <section id="raheemToolsPanel" role="dialog" aria-modal="true" aria-label="لوحة الأدوات"></section>
</div>
 <script id="raheem-tools-js" src="/tools.js" defer>
/* RAHEEM_WEB_MEMORY_UI_V1 */
(() => {
  let lastSection = null;
  let loading = false;

  async function restoreSectionHistory(section, force = false) {
    if (!section || loading || (!force && section === lastSection)) return;
    lastSection = section;
    loading = true;

    try {
      const r = await fetch('/api/chat/history?section=' + encodeURIComponent(section), {
        credentials: 'same-origin'
      });
      if (!r.ok) return;

      const data = await r.json();
      if (!data.ok || !Array.isArray(data.messages) || !data.messages.length) return;

      if (section !== activeSection) return;

      chatContainer.innerHTML = '';
      for (const m of data.messages) {
        addMessage(m.content, m.role === 'assistant' ? 'ai' : 'user');
      }
      scrollToBottom(true);
    } catch (e) {
      console.error('[web memory restore]', e);
    } finally {
      loading = false;
    }
  }

  setTimeout(() => restoreSectionHistory(activeSection, true), 500);
  setInterval(() => {
    if (activeSection !== lastSection) {
      restoreSectionHistory(activeSection);
    }
  }, 800);
})();

</script>
